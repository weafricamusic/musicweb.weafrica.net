name: weafrica_music
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  firebase_messaging: ^16.1.1
  flutter_local_notifications: ^17.2.2
  google_sign_in: ^7.2.0
  url_launcher: ^6.3.0
  webview_flutter: ^4.10.0
  share_plus: ^10.1.4
  path_provider: ^2.1.5
  just_audio: ^0.10.5
  audio_session: ^0.1.25
  video_player: ^2.11.1
  web: ^1.0.0
  supabase_flutter: ^2.12.4
  google_fonts: ^6.1.0
  provider: ^6.1.5+1
  cached_network_image: ^3.4.1
  glass_kit: ^4.0.2
  http: ^1.6.0
  shared_preferences: ^2.5.5
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shimmer: ^3.0.0
  flutter_secure_storage: ^10.0.0
  flutter_cache_manager: ^3.4.1
  crypto: ^3.0.6
  file_picker: ^8.1.2
  device_info_plus: ^11.3.0
  package_info_plus: ^8.1.2
  intl: ^0.20.2
  go_router: ^14.8.0
  dio: ^5.4.0
  image: ^4.7.2
  connectivity_plus: ^7.1.1
  qr_flutter: ^4.1.0
  socket_io_client: ^2.0.3+1
  visibility_detector: ^0.4.0+2
  agora_rtc_engine: ^6.5.3
  agora_rtm: ^1.6.3
  confetti: ^0.7.0
  permission_handler: ^12.0.1
  camera: ^0.11.0+2
  rxdart: ^0.27.7
  audio_service: ^0.18.18
  audioplayers: ^6.1.0
  wakelock_plus: ^1.3.2
  vibration: ^3.1.0
  ffmpeg_kit_flutter_new_min_gpl: ^2.1.1
  image_picker: ^1.2.1
  firebase_database: ^12.1.4
  google_mobile_ads: ^8.0.0
  cloud_firestore: ^6.3.0
  firebase_storage: ^13.3.0
  flutter_svg: ^2.2.4
  flutter_facebook_auth: ^7.1.2
  firebase_analytics: ^12.0.0
  flutter_bloc: ^8.1.5
  equatable: ^2.0.5
  flutter_animate: ^4.5.0
  flutter_riverpod: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.2
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  web:
    generate: true
  image_path: "assets/images/Designer.png"
  adaptive_icon_foreground: "assets/images/Designer.png"
  adaptive_icon_background: "#6A5CFF"
  remove_alpha_ios: true
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/config/supabase.env.json
    - assets/sounds/ringtone.mp3

dependency_overrides:
  agora_rtm:
    path: packages/agora_rtm
  flutter_app_badger:
    path: packages/flutter_app_badger
