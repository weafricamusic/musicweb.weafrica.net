<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeAfrica Music Battle - Agora RTC</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
        }

        .header {
            background: rgba(0, 0, 0, 0.3);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .header h1 {
            font-size: 1.5rem;
            background: linear-gradient(90deg, #f39c12, #e74c3c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-controls {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .role-selector {
            display: flex;
            gap: 0.5rem;
        }

        .role-btn {
            padding: 0.5rem 1rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: transparent;
            color: #fff;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .role-btn.active {
            background: #f39c12;
            border-color: #f39c12;
            color: #000;
        }

        .role-btn:hover:not(.active) {
            background: rgba(255, 255, 255, 0.1);
        }

        .main-container {
            display: flex;
            height: calc(100vh - 70px);
        }

        .video-section {
            flex: 1;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .section-title {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 0.5rem;
        }

        .local-video-container {
            position: relative;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 12px;
            overflow: hidden;
            aspect-ratio: 16/9;
            max-height: 40vh;
        }

        .local-video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        .local-label {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.6);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
        }

        .remote-videos {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1rem;
            flex: 1;
        }

        .remote-video-container {
            position: relative;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 12px;
            overflow: hidden;
            aspect-ratio: 16/9;
        }

        .remote-video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .remote-label {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.6);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
        }

        .sidebar {
            width: 320px;
            background: rgba(0, 0, 0, 0.2);
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
        }

        .sidebar-section {
            padding: 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .channel-info {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .channel-input {
            padding: 0.5rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            border-radius: 4px;
            font-size: 0.9rem;
        }

        .channel-input:focus {
            outline: none;
            border-color: #f39c12;
        }

        .control-buttons {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .btn {
            padding: 0.6rem 1.2rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .btn-primary {
            background: linear-gradient(90deg, #f39c12, #e74c3c);
            color: #fff;
        }

        .btn-primary:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .btn-danger {
            background: #e74c3c;
            color: #fff;
        }

        .btn-danger:hover {
            background: #c0392b;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.7);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #95a5a6;
        }

        .status-dot.connected {
            background: #2ecc71;
            box-shadow: 0 0 8px #2ecc71;
        }

        .status-dot.disconnected {
            background: #e74c3c;
        }

        .chat-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 0.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .chat-message {
            padding: 0.5rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            font-size: 0.85rem;
        }

        .chat-message .sender {
            color: #f39c12;
            font-weight: 500;
        }

        .chat-message .time {
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.75rem;
        }

        .chat-input-container {
            display: flex;
            gap: 0.5rem;
            padding: 0.5rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .chat-input {
            flex: 1;
            padding: 0.5rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            border-radius: 4px;
            font-size: 0.85rem;
        }

        .chat-input:focus {
            outline: none;
            border-color: #f39c12;
        }

        .game-state {
            padding: 1rem;
            background: rgba(243, 156, 18, 0.1);
            border-radius: 8px;
            margin-bottom: 1rem;
        }

        .game-state h3 {
            font-size: 0.9rem;
            color: #f39c12;
            margin-bottom: 0.5rem;
        }

        .game-state-item {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            padding: 0.25rem 0;
        }

        .participants-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .participant {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            font-size: 0.85rem;
        }

        .participant.host {
            border-left: 3px solid #f39c12;
        }

        .participant.audience {
            border-left: 3px solid #3498db;
        }

        @media (max-width: 768px) {
            .main-container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                border-left: none;
                border-top: 1px solid rgba(255, 255, 255, 0.1);
                max-height: 40vh;
            }
        }
    </style>
</head>

<body>
    <div class="header">
        <h1>🎵 WeAfrica Music Battle</h1>
        <div class="header-controls">
            <div class="role-selector">
                <button class="role-btn active" data-role="host" onclick="setRole('host')">🎤 Player (Host)</button>
                <button class="role-btn" data-role="audience" onclick="setRole('audience')">👁 Spectator</button>
            </div>
            <div class="status-indicator">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">Disconnected</span>
            </div>
        </div>
    </div>

    <div class="main-container">
        <div class="video-section">
            <div>
                <div class="section-title">Your Video</div>
                <div class="local-video-container" id="local-player">
                    <div class="local-label">You</div>
                </div>
            </div>

            <div>
                <div class="section-title">Remote Players</div>
                <div class="remote-videos" id="remote-playerlist">
                    <!-- Remote videos will be added here dynamically -->
                </div>
            </div>
        </div>

        <div class="sidebar">
            <div class="sidebar-section">
                <div class="section-title">Channel</div>
                <div class="channel-info">
                    <input type="text" class="channel-input" id="channelInput"
                        placeholder="Enter channel name or match ID" value="">
                    <div class="control-buttons">
                        <button class="btn btn-primary" id="joinBtn" onclick="handleJoin()">
                            <span>🔗</span> Join Channel
                        </button>
                        <button class="btn btn-danger" id="leaveBtn" onclick="handleLeave()" disabled>
                            <span>🚪</span> Leave
                        </button>
                    </div>
                </div>
            </div>

            <div class="sidebar-section">
                <div class="section-title">Game State</div>
                <div class="game-state" id="gameState">
                    <h3>Battle Info</h3>
                    <div class="game-state-item">
                        <span>Status:</span>
                        <span id="battleStatus">Waiting</span>
                    </div>
                    <div class="game-state-item">
                        <span>Participants:</span>
                        <span id="participantCount">0</span>
                    </div>
                </div>

                <div class="section-title">Participants</div>
                <div class="participants-list" id="participantsList">
                    <!-- Participants will be listed here -->
                </div>
            </div>

            <div class="sidebar-section chat-section">
                <div class="section-title">Chat / Game Events</div>
                <div class="chat-messages" id="chatMessages">
                    <!-- Chat messages will appear here -->
                </div>
                <div class="chat-input-container">
                    <input type="text" class="chat-input" id="chatInput" placeholder="Type a message...">
                    <button class="btn btn-secondary" onclick="sendMessage()">Send</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="./main.js"></script>
</body>

</html>
