    /* Ensure full viewport coverage */
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;

    }

    /* Flutter view should fill the entire viewport */
    flutter-view {
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100% !important;
    }

    /* Ensure the body element fills the viewport */
    body>flutter-view {

      height: 100%;
    }

    /* Prevent Zoho SalesIQ from interfering with layout */
    #zsiqwidget,
    .zsiq_theme1 {
      z-index: 9999 !important;
    }

    /* Handle mobile safe areas */
    @supports (padding: env(safe-area-inset-top)) {
      flutter-view {
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
      }
    }

    /* Prevent horizontal scroll */

    }

<body>
  <script src="flutter.js" defer></script>
  <script>
    // Modern Flutter Web initialization with proper viewport handling
    window.addEventListener('load', function (ev) {
      // Ensure body has proper dimensions before Flutter loads
      document.body.style.width = '100%';
      document.body.style.height = '100%';
      document.documentElement.style.width = '100%';
      document.documentElement.style.height = '100%';

      if (_flutter && _flutter.loader) {
        _flutter.loader.loadEntrypoint({
          serviceWorker: {
            serviceWorkerVersion: '1.0.0',
          },
          onEntrypointLoaded: async function (engineInitializer) {
            // Initialize with explicit viewport configuration
            let appRunner = await engineInitializer.initializeEngine({
              renderer: 'canvaskit',
              // Ensure the engine uses the full viewport
              useColorCorrectness: true,
            });
            await appRunner.runApp();

            // Post-initialization viewport fix
            setTimeout(function () {
              var flutterView = document.querySelector('flutter-view');
              if (flutterView) {
                flutterView.style.width = '100%';
                flutterView.style.height = '100%';
                flutterView.style.position = 'absolute';
                flutterView.style.top = '0';
                flutterView.style.left = '0';
              }
            }, 100);
          }
        });
      }
    });
  </script>
</body>
