<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WeAfrica Music</title>

  <!-- Load Agora BEFORE Flutter -->
  <script src="https://cdn.agora.io/sdk/release/AgoraRTC_N-4.24.3.js"></script>

  <script>
    // Create a promise that resolves when Agora is ready
    window.agoraReadyPromise = new Promise((resolve) => {
      const checkAgora = () => {
        if (typeof AgoraRTC !== 'undefined' && AgoraRTC.VERSION) {
          window.AgoraRTC = AgoraRTC;
          window.agoraReady = true;
          console.log('✅ AgoraRTC ready:', AgoraRTC.VERSION);
          resolve(AgoraRTC);
          return true;
        }
        return false;
      };

      if (!checkAgora()) {
        let attempts = 0;
        const interval = setInterval(() => {
          attempts++;
          if (checkAgora()) {
            clearInterval(interval);
          } else if (attempts > 100) {
            console.error('❌ AgoraRTC failed to load');
            clearInterval(interval);
            resolve(null);
          }
        }, 100);
      }
    });

    // Helper function: play an Agora track into a DOM element by ID
    // Called from Dart via dart:js_util
    window._agoraPlayTrack = function (track, elementIdOrElement) {
      if (!track || !track.play) {
        console.error('_agoraPlayTrack: invalid track', track);
        return;
      }
      const el = typeof elementIdOrElement === 'string'
        ? document.getElementById(elementIdOrElement)
        : elementIdOrElement;
      if (!el) {
        console.error('_agoraPlayTrack: element not found:', elementIdOrElement);
        return;
      }
      track.play(el);
      console.log('_agoraPlayTrack: playing track into', elementIdOrElement);
    };

    // Helper function: stop an Agora track
    window._agoraStopTrack = function (track) {
      if (!track || !track.stop) {
        console.error('_agoraStopTrack: invalid track', track);
        return;
      }
      track.stop();
      console.log('_agoraStopTrack: track stopped');
    };
  </script>
</head>

<body>
  <script src="main.dart.js" type="application/javascript"></script>
</body>

</html>
